site_name: Test with a module (test)

nav:
    - Home: index.md
    - Environment for {{ unit_price}}: environment.md
    - Second:
        - other.md
    - Not interpreted: literal.md

plugins:
  - search
  - macros:
      include_dir: include
      modules: ['mkdocs-macros-test:mkdocs_macros_test']
      on_error_fail: true
      verbose: true

extra:
  unit_price: 50